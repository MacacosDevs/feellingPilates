services:
  postgres:
    image: postgres:16-alpine
    container_name: feelingpilates-db
    environment:
      POSTGRES_DB: ${DB_NAME:-FeelingPilates}
      POSTGRES_USER: ${DB_USER:-feelingpilates}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-feelingpilates}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - feelingpilates-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-feelingpilates} -d ${DB_NAME:-FeelingPilates}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  feelingpilates-data:
