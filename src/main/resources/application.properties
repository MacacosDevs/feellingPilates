spring.application.name=feelingpilates
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:FeelingPilates}
spring.datasource.username=${DB_USER:feelingpilates}
spring.datasource.password=${DB_PASSWORD:feelingpilates}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

app.jwt.secreto=${JWT_SECRETO:cambia-este-secreto-en-produccion-minimo-32-bytes!}
app.jwt.expiracion-segundos=${JWT_EXPIRACION_SEGUNDOS:86400}

# Web Client ID de OAuth de Google Cloud Console (el mismo que usa la app móvil
# como webClientId). Mientras esté vacío, el login con Google falla de forma
# controlada en vez de arrancar con una validación insegura.
app.google.client-id=${GOOGLE_CLIENT_ID:}

app.cors.origenes-permitidos=${CORS_ORIGENES_PERMITIDOS:http://localhost:5173}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.invitacion.expiracion-horas=${INVITACION_EXPIRACION_HORAS:168}

# Claves de Stripe (modo prueba). Mientras STRIPE_SECRET_KEY esté vacío, los
# endpoints de pago fallan de forma controlada en vez de llamar a Stripe sin clave.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Una compra que se queda en "pendiente" (el cliente abrió la hoja de pago pero
# nunca la confirmó) se marca como "cancelada" pasado este tiempo, para que no
# se acumulen indefinidamente en el historial.
app.pagos.compra-pendiente-expira-minutos=${COMPRA_PENDIENTE_EXPIRA_MINUTOS:60}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
